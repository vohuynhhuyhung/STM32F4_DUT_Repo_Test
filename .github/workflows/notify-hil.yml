name: Notify HIL CI

# On every push to main, tell the HIL repo to poll right away
# (instead of waiting for its 5-minute cron, which GitHub may delay).
on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger HIL CI
        env:
          HIL_DISPATCH_TOKEN: ${{ secrets.HIL_DISPATCH_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HIL_DISPATCH_TOKEN" \
            https://api.github.com/repos/vohuynhhuyhung/Hardware_in_the_Loop-System/dispatches \
            -d '{"event_type":"hil-push"}'
